# Global distrobox defaults, read by distrobox-create AND distrobox-enter:
# create-time settings are baked into a container and reach new boxes only, while
# anything enter reads also applies to existing ones.

# Does NOT unmount the host home, which distrobox always bind-mounts (by design).
container_home_prefix="${HOME}/.homes"

# The box home sits under the host home, so mise's config walk-up finds the
# host's global config, calls it an untrusted project config, and prompts on every
# run. Both spellings of that one file are needed: distrobox mounts the host home
# *and* the whole host filesystem at /run/host, and the walk can arrive either
# way. Lives here rather than in .zshrc to also cover
# `distrobox enter <box> -- <cmd>`, which execs directly and reads no rc file.
# Must be --env=K=V — distrobox passes this value to podman as a single argument.
container_manager_additional_flags="--env=MISE_IGNORED_CONFIG_PATHS=${HOME}/.config/mise/config.toml:/run/host${HOME}/.config/mise/config.toml"

# distrobox-init runs hooks as root at every container start, hence the su.
# -s /bin/sh because the container user's login shell is inherited from the host
# ($SHELL=zsh) and may not exist in the image; || true keeps a failed seed from
# aborting container setup.
container_init_hook="su - ${USER} -s /bin/sh -c ${HOME}/.config/distrobox/seed-home || true"
